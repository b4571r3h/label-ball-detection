<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpinEvo | Label Review</title>
  <script defer src="static/label_review.js?v=1"></script>
  <style>
    :root { --bg:#0f172a; --card:#111827; --muted:#94a3b8; --accent:#22d3ee; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system; background:var(--bg); color:#e5e7eb; }
    .wrap { max-width:1100px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid #1f2937; border-radius:14px; padding:16px; }
    .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
    .btn { background:#1f2937; border:1px solid #374151; padding:14px 18px; border-radius:12px; color:#e5e7eb; cursor:pointer; font-size:16px; }
    .btn:hover { background:#111827; }
    .muted { color: var(--muted); font-size:14px; }
    select, input { height:44px; font-size:16px; }

    #imgBox { position: relative; display: inline-block; max-width: 100%; touch-action: manipulation; }
    #frameImg { max-width: 100%; border-radius: 10px; display:block; }
    #labelOverlay {
      position:absolute; left:0; top:0;
      width:100%; height:100%;
      pointer-events:none;
      z-index: 20;
    }
    .label-circle {
      position:absolute;
      border: 2px solid rgba(34,197,94,0.95);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(34,197,94,0.08);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
    }
    #crosshair {
      position:absolute; left:0; top:0;
      border:2px solid #22c55e; border-radius:50%;
      width:24px; height:24px;
      pointer-events:none; z-index: 30;
      transform: translate(-50%, -50%);
      display:none;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 14px rgba(34, 197, 94, 0.55);
    }

    #reviewBar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .toolbar input { width: 90px; }
    @media (max-width: 640px) {
      .row { gap:10px; }
      .btn { width:100%; }
      .toolbar .btn { width: auto; }
      #crosshair { width:28px; height:28px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="page-title">SpinEvo | Label Review <span aria-hidden="true">🧪</span></h1>
    <p class="muted">Bestehende Labels anzeigen (alle Boxen) und optional per Klick korrigieren. „OK“ übernimmt und geht weiter.</p>

    <div class="card" style="margin-top:16px;">
      <div class="row" style="justify-content:space-between;">
        <div>
          <div class="muted">Task auswählen</div>
          <select id="taskSelect" style="min-width: 360px;">
            <option value="">(Tasks laden…)</option>
          </select>
        </div>
        <div id="taskMeta" class="muted"></div>
      </div>
    </div>

    <div class="card" id="reviewCard" style="margin-top:16px; display:none;">
      <div class="row" style="justify-content:space-between;">
        <div>
          <strong>Frame:</strong> <span id="frameInfo">–</span>
          <span class="muted" id="labelInfo">–</span>
        </div>
        <div class="toolbar">
          <label class="muted">Box (px): <input type="number" id="boxSize" value="24" min="6" max="64" step="2" /></label>
          <button class="btn" id="btnPrev" type="button">◀</button>
          <button class="btn" id="btnOk" type="button" title="Wenn vorher geklickt wurde: Label speichern (1 Box). Sonst nur bestätigen.">OK</button>
          <button class="btn" id="btnNext" type="button">▶</button>
        </div>
      </div>

      <div style="margin-top:16px; text-align:center;">
        <div id="imgBox">
          <img id="frameImg" src="" alt="frame" />
          <div id="labelOverlay"></div>
          <div id="crosshair"></div>
        </div>
      </div>
    </div>

    <div class="muted" id="status" style="margin-top:10px;">Lade…</div>
  </div>
</body>
</html>
