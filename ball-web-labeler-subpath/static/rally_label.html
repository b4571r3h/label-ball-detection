<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpinEvo | Rally Labeling</title>
  <script defer src="static/rally_label.js?v=3"></script>
  <style>
    :root { --bg:#0f172a; --card:#111827; --muted:#94a3b8; --line:#1f2937; --accent:#22d3ee; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system; background:var(--bg); color:#e5e7eb; }
    .wrap { max-width:1200px; margin:20px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .btn { background:#1f2937; color:#e5e7eb; border:1px solid #374151; border-radius:10px; padding:8px 12px; cursor:pointer; }
    .btn:hover { background:#374151; }
    .btn.active { border-color: var(--accent); color: var(--accent); }
    .muted { color:var(--muted); font-size:13px; }
    .big { font-size:19px; font-weight:700; margin:0 0 8px 0; }
    #frameImg, #frameVideo { max-width:100%; max-height:72vh; display:block; border-radius:10px; }
    #mediaWrap { position:relative; display:inline-block; line-height:0; }
    #overlay { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
    #overlay.capture { pointer-events:auto; cursor:crosshair; }
    .pill { font-size:12px; border-radius:99px; padding:2px 10px; border:1px solid #374151; }
    .pill.ok { color:#22c55e; border-color:#14532d; background:rgba(34,197,94,.08); }
    .pill.off { color:#94a3b8; }
    #timeline { height:20px; background:#1f2937; border-radius:8px; position:relative; }
    .marker { position:absolute; top:0; bottom:0; width:2px; transform:translateX(-50%); }
    .start { background:#22c55e; }
    .end { background:#f97316; }
    .cur { position:absolute; top:0; bottom:0; width:2px; background:#fff; transform:translateX(-50%); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="big">SpinEvo | Rally Labeling</h1>
    <p class="muted">
      Frames/Video laden, mit <strong>S</strong> Rally-Start und <strong>E</strong> Rally-Ende markieren,
      <strong>U</strong> = Undo, dann speichern. <strong>T</strong> = Tisch/Netz markieren
      (statisch pro Task: 4 Tischecken, optional 2 Netzpunkte).
    </p>

    <div class="card row">
      <a href="./" class="btn" style="text-decoration:none;">← Ball-Labeler</a>
      <label>Task:
        <select id="taskSelect"></select>
      </label>
      <button id="loadBtn" class="btn">Laden</button>
      <button id="saveBtn" class="btn">Speichern</button>
      <span id="status" class="muted">Bereit</span>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div id="frameInfo">Frame - / -</div>
        <div class="row">
          <button id="prevBtn" class="btn">◀</button>
          <button id="nextBtn" class="btn">▶</button>
          <button id="playBtn" class="btn">▶ Play (P)</button>
          <button id="startBtn" class="btn">Start (S)</button>
          <button id="endBtn" class="btn">Ende (E)</button>
          <button id="deleteBtn" class="btn">Frame-Events löschen (D)</button>
          <button id="undoBtn" class="btn">Undo (U)</button>
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <span class="muted">Tisch/Netz:</span>
        <span id="tableStatus" class="pill off">kein Label</span>
        <button id="tableBtn" class="btn">Tisch markieren (T)</button>
        <button id="tableSaveBtn" class="btn" style="display:none;">Ohne Netz speichern</button>
        <button id="tableCancelBtn" class="btn" style="display:none;">Abbrechen (Esc)</button>
        <button id="tableDeleteBtn" class="btn">Löschen</button>
        <label class="muted" style="cursor:pointer;">
          <input id="tableShowChk" type="checkbox" checked /> anzeigen
        </label>
        <span id="tableHint" class="muted"></span>
      </div>
      <input id="scrub" type="range" min="0" max="0" value="0" style="width:100%; margin:10px 0;" />
      <div id="timeline"></div>
      <div id="mediaWrap" style="margin-top:12px;">
        <img id="frameImg" src="" alt="frame" />
        <video id="frameVideo" style="display:none;" playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>
  </div>
</body>
</html>
