<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpinEvo | Import-Datensatz Review</title>
  <script defer src="static/import_review.js?v=2"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #111827; --border: #1f2937; --muted: #94a3b8;
      --accent: #22d3ee; --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system; background: var(--bg); color: #e5e7eb; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .muted { color: var(--muted); font-size: 13px; }

    .stats { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .stat { display: flex; align-items: center; gap: 8px; }
    .stat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot-ball  { background: var(--green); }
    .dot-empty { background: var(--yellow); }
    .dot-none  { background: var(--muted); }
    .stat-count { font-size: 20px; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .stat-total { font-size: 13px; color: var(--muted); }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: #e5e7eb; cursor: pointer; font-size: 13px; }
    .tab:hover { background: #1f2937; }
    .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }

    .split-btn { padding: 6px 18px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: #e5e7eb; cursor: pointer; font-size: 13px; font-weight: 500; }
    .split-btn.active { background: #1e3a5f; border-color: #2563eb; color: #bfdbfe; }

    .nav-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .nav-info { font-size: 13px; color: var(--muted); min-width: 80px; }
    .btn { background: #1f2937; border: 1px solid #374151; padding: 7px 14px; border-radius: 9px; color: #e5e7eb; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: #374151; }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-ok     { background: #14532d; border-color: #166534; color: #dcfce7; }
    .btn-ok:hover:not(:disabled)     { background: #166534; }
    .btn-noball { background: #451a03; border-color: #78350f; color: #fef3c7; }
    .btn-noball:hover:not(:disabled) { background: #78350f; }
    .jump-input { width: 64px; height: 34px; background: #1f2937; border: 1px solid #374151; border-radius: 7px; color: #e5e7eb; padding: 0 8px; font-size: 13px; }

    #imgBox { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
    #frameImg { max-width: 100%; border-radius: 10px; display: block; cursor: crosshair; }
    #labelCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px; pointer-events: none; }
    #crosshair {
      position: absolute; border-radius: 50%; pointer-events: none;
      transform: translate(-50%, -50%); display: none;
      border: 2px solid #fbbf24;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 14px rgba(251,191,36,0.5);
    }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; }
    .badge-ball  { background: rgba(34,197,94,.12); color: var(--green); border: 1px solid rgba(34,197,94,.3); }
    .badge-empty { background: rgba(245,158,11,.12); color: var(--yellow); border: 1px solid rgba(245,158,11,.3); }
    .badge-none  { background: rgba(148,163,184,.1); color: var(--muted); border: 1px solid rgba(148,163,184,.2); }
    .kbd { display:inline-block; background:#0f172a; border:1px solid #374151; border-radius:4px; padding:0 5px; font-size:11px; font-family:monospace; color:var(--muted); }

    #statusMsg { min-height: 18px; font-size: 13px; color: var(--muted); margin-top: 8px; }
    #loadingMsg { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
    <h1 style="margin:0;">SpinEvo | Import-Datensatz Review</h1>
    <div class="muted" style="font-size:12px;">
      <a href="./">← Ball-Labeler</a> ·
      <a href="label-review">Label Review</a>
    </div>
  </div>

  <!-- Stats -->
  <div class="card">
    <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
      <div style="display:flex; gap:8px;">
        <button class="split-btn active" data-split="train">Train</button>
        <button class="split-btn"        data-split="val">Val</button>
      </div>
      <span id="loadingMsg" class="muted">Lade…</span>
    </div>
    <div class="stats" id="statsWrap" style="display:none;">
      <div class="stat">
        <div class="stat-dot dot-ball"></div>
        <div><div class="stat-count" id="sBall">0</div><div class="stat-label">mit Ball</div></div>
      </div>
      <div class="stat">
        <div class="stat-dot dot-empty"></div>
        <div><div class="stat-count" id="sEmpty">0</div><div class="stat-label">Kein Ball (leer)</div></div>
      </div>
      <div class="stat">
        <div class="stat-dot dot-none"></div>
        <div><div class="stat-count" id="sNone">0</div><div class="stat-label">kein Label</div></div>
      </div>
      <div class="stat-total" id="sTotal"></div>
    </div>
  </div>

  <!-- Review -->
  <div class="card" id="reviewCard" style="display:none;">
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
      <div class="tabs">
        <button class="tab active" data-filter="all">Alle</button>
        <button class="tab" data-filter="ball">Mit Ball</button>
        <button class="tab" data-filter="empty">Leer (kein Ball)</button>
        <button class="tab" data-filter="none">Kein Label</button>
      </div>
      <div class="nav-bar">
        <span class="nav-info" id="navInfo">– / –</span>
        <button class="btn" id="btnPrev" disabled>◀</button>
        <button class="btn" id="btnRandom">Zufall</button>
        <button class="btn" id="btnNext" disabled>▶</button>
        <input class="jump-input" id="jumpInput" type="number" min="1" placeholder="#" />
        <button class="btn" id="btnJump">→</button>
      </div>
    </div>

    <!-- Bild -->
    <div style="text-align:center;">
      <div id="imgBox">
        <img id="frameImg" src="" alt="frame" />
        <canvas id="labelCanvas"></canvas>
        <div id="crosshair"></div>
      </div>
    </div>

    <!-- Aktionen -->
    <div style="margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between;">
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <span id="labelBadge" class="badge badge-none">–</span>
        <label class="muted" style="display:flex; align-items:center; gap:5px;">
          Box:
          <input type="number" id="boxSize" value="24" min="6" max="64" step="2"
            style="width:56px; height:30px; background:#1f2937; border:1px solid #374151; border-radius:6px; color:#e5e7eb; padding:0 6px; font-size:13px;" />
          px
        </label>
        <span id="filenameInfo" class="muted" style="font-size:12px; font-family:monospace;"></span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ok"     id="btnOk"     >✓ OK &amp; weiter <span class="kbd">↵</span></button>
        <button class="btn btn-noball" id="btnNoball"  >○ Kein Ball &amp; weiter <span class="kbd">N</span></button>
      </div>
    </div>

    <div id="statusMsg"></div>

    <div class="muted" style="margin-top:10px; font-size:12px; line-height:1.7;">
      <strong>Klick auf Bild</strong> = Ball markieren (gelber Kreis → sofort speichern mit <span class="kbd">↵</span>) ·
      <span class="kbd">N</span> = Kein Ball bestätigen &amp; weiter ·
      <span class="kbd">↵</span> = OK &amp; weiter (wenn bereits gelabelt) ·
      <span class="kbd">←</span><span class="kbd">→</span> navigieren
    </div>
  </div>
</div>
</body>
</html>
