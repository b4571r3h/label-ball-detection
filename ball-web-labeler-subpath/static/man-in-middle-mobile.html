<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MitM Review</title>
  <script defer src="../static/man-in-middle-mobile.js?v=1"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a;
      color: #e5e7eb;
      font-family: ui-sans-serif, system-ui, -apple-system;
      overflow: hidden;
      touch-action: none;
    }

    /* Hauptcontainer: zentriert, 9:16 */
    #stage {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    /* Karte: 9:16, füllt Viewport */
    #cardWrap {
      position: relative;
      width:  min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      max-width: 480px;
      overflow: hidden;
    }

    #card {
      position: absolute; inset: 0;
      will-change: transform;
      user-select: none;
    }

    canvas#frameCanvas {
      display: block;
      width: 100%; height: 100%;
      background: #111;
    }

    /* Richtungs-Hints an den Seiten */
    .hint {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
      pointer-events: none; opacity: 0.25;
      padding: 8px 6px;
      writing-mode: vertical-rl;
    }
    .hint-left  { left: 6px;  color: #22c55e; transform: translateY(-50%) rotate(180deg); }
    .hint-right { right: 6px; color: #94a3b8; }

    /* Swipe-Overlays */
    .swipe-overlay {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; letter-spacing: 1px;
    }
    #overlayLeft  { background: rgba(34,197,94,0.35); color: #86efac; }
    #overlayRight { background: rgba(100,116,139,0.35); color: #cbd5e1; }

    /* Konfidenz-Badge */
    #confBadge {
      position: absolute; top: 12px; left: 12px;
      background: rgba(34,211,238,0.85); color: #000;
      font-size: 12px; font-weight: 700;
      padding: 3px 9px; border-radius: 6px;
      pointer-events: none;
      display: none;
    }
    #noBallBadge {
      position: absolute; top: 12px; left: 12px;
      background: rgba(239,68,68,0.85); color: #fff;
      font-size: 12px; font-weight: 700;
      padding: 3px 9px; border-radius: 6px;
      pointer-events: none;
      display: none;
    }

    /* Ladeindikator */
    #loadingMsg {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #475569; font-size: 14px;
    }

    /* Untere Leiste */
    #bottomBar {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
      padding: 20px 14px 14px;
      pointer-events: none;
    }
    #counter {
      font-size: 13px; color: #94a3b8; text-align: center;
    }
    #hintBar {
      display: flex; justify-content: space-between;
      font-size: 11px; margin-top: 4px;
    }
    .hint-bar-left  { color: rgba(34,197,94,0.6); }
    .hint-bar-right { color: rgba(148,163,184,0.6); }

    /* Done-Overlay */
    #doneOverlay {
      position: absolute; inset: 0;
      background: rgba(10,10,10,0.92);
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; text-align: center; padding: 24px;
    }
    #doneOverlay h2 { font-size: 22px; color: #22c55e; }
    #doneOverlay p  { font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
<div id="stage">
  <div id="cardWrap">
    <div id="card">
      <canvas id="frameCanvas" width="540" height="960"></canvas>
      <div id="loadingMsg">Wird geladen…</div>
      <div id="confBadge"></div>
      <div id="noBallBadge">Kein Ball</div>
      <div id="overlayLeft"  class="swipe-overlay">FREIGEBEN</div>
      <div id="overlayRight" class="swipe-overlay">ÜBERSPRINGEN</div>
      <div id="bottomBar">
        <div id="counter">–</div>
        <div id="hintBar">
          <span class="hint-bar-left">← Freigeben</span>
          <span class="hint-bar-right">Überspringen →</span>
        </div>
      </div>
    </div>
    <!-- Richtungs-Hints an Seiten -->
    <div class="hint hint-left">Freigeben</div>
    <div class="hint hint-right">Überspringen</div>

    <!-- Done -->
    <div id="doneOverlay">
      <h2>Alles reviewt</h2>
      <p>Keine ausstehenden Frames mehr.<br>Gut gemacht!</p>
    </div>
  </div>
</div>
</body>
</html>
