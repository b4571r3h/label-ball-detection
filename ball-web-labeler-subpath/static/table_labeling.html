<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpinEvo | Tisch-Labeling</title>
  <script defer src="static/table_labeling.js?v=3"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #111827; --border: #1f2937; --muted: #94a3b8;
      --accent: #22d3ee; --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
      --cyan: #22d3ee;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system; background: var(--bg); color: #e5e7eb; }
    .wrap { max-width: 1300px; margin: 0 auto; padding: 12px 16px; }
    h1 { margin: 0 0 12px; font-size: 20px; font-weight: 700; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: 13px; }

    /* Filter tabs */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: #e5e7eb; cursor: pointer; font-size: 13px; }
    .tab:hover { background: #1f2937; }
    .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }

    /* Buttons */
    .btn { background: #1f2937; border: 1px solid #374151; padding: 8px 14px; border-radius: 9px; color: #e5e7eb; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: #374151; }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-ok     { background: #14532d; border-color: #166534; color: #dcfce7; }
    .btn-ok:hover:not(:disabled)     { background: #166534; }
    .btn-notable { background: #451a03; border-color: #78350f; color: #fef3c7; }
    .btn-notable:hover:not(:disabled) { background: #78350f; }
    .btn-del    { background: #450a0a; border-color: #7f1d1d; color: #fee2e2; }
    .btn-del:hover:not(:disabled)    { background: #7f1d1d; }
    .btn-export { background: #1e3a5f; border-color: #2563eb; color: #bfdbfe; }
    .btn-export:hover:not(:disabled) { background: #1d4ed8; }

    /* Main layout */
    .main-layout { display: flex; gap: 12px; align-items: flex-start; }
    #imgContainer {
      flex: 1 1 0; min-width: 0; position: relative;
      display: inline-block; /* shrink-wrap */
      line-height: 0;
    }
    #frameImg { max-width: 100%; border-radius: 10px; display: block; }
    #kpCanvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 10px;
      cursor: crosshair;
    }

    /* Keypoint panel */
    #kpPanel {
      flex: 0 0 260px; width: 260px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .kp-group-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); font-weight: 600; margin-bottom: 2px;
    }
    .kp-list { display: flex; flex-direction: column; gap: 4px; }

    .kp-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: #0f172a;
      cursor: pointer; transition: border-color .1s;
    }
    .kp-item:hover { border-color: #4b5563; }
    .kp-item.active { border-color: var(--accent); background: #0c1929; }

    .kp-num {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      border: 2px solid currentColor;
    }
    .kp-num.table-kp { color: var(--green); }
    .kp-num.net-kp   { color: var(--cyan);  }

    .kp-name { font-size: 13px; font-weight: 500; min-width: 62px; }

    .kp-vis-badge {
      flex: 1; font-size: 12px; padding: 2px 7px; border-radius: 10px;
      text-align: center;
    }
    .vis-2  { background: rgba(34,197,94,.15);  color: var(--green);  border: 1px solid rgba(34,197,94,.3); }
    .vis-1  { background: rgba(245,158,11,.15); color: var(--yellow); border: 1px solid rgba(245,158,11,.3); }
    .vis-0  { background: rgba(239,68,68,.1);   color: #f87171;       border: 1px solid rgba(239,68,68,.25); }
    .vis-na { background: rgba(148,163,184,.1);  color: var(--muted);  border: 1px solid rgba(148,163,184,.2); }

    .kp-btn-na {
      font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid #374151;
      background: transparent; color: var(--muted); cursor: pointer; flex-shrink: 0;
    }
    .kp-btn-na:hover { background: #1f2937; color: #e5e7eb; }
    .kp-btn-clear {
      font-size: 13px; padding: 1px 5px; border-radius: 5px; border: 1px solid #374151;
      background: transparent; color: var(--muted); cursor: pointer; flex-shrink: 0; line-height: 1.4;
    }
    .kp-btn-clear:hover { background: #7f1d1d; border-color: var(--red); color: #fca5a5; }

    /* Nav bar */
    .nav-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .nav-info { font-size: 13px; color: var(--muted); min-width: 80px; }
    .jump-input { width: 64px; height: 34px; background: #1f2937; border: 1px solid #374151; border-radius: 7px; color: #e5e7eb; padding: 0 8px; font-size: 13px; }

    /* Status */
    #statusMsg { min-height: 18px; font-size: 13px; color: var(--muted); margin-top: 6px; }

    /* Kbd */
    .kbd { display: inline-block; background: #0f172a; border: 1px solid #374151; border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: monospace; color: var(--muted); }

    select {
      height: 38px; font-size: 14px; background: #1f2937; border: 1px solid #374151;
      border-radius: 8px; color: #e5e7eb; padding: 0 10px; min-width: 300px;
    }

    /* Stats */
    .stats { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .stat { display: flex; align-items: center; gap: 8px; }
    .stat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot-labeled  { background: var(--green); }
    .dot-notable  { background: var(--yellow); }
    .dot-none     { background: var(--muted); }
    .stat-count   { font-size: 20px; font-weight: 700; }
    .stat-label   { font-size: 12px; color: var(--muted); }
    .stat-total   { font-size: 13px; color: var(--muted); }

    @media (max-width: 800px) {
      .main-layout { flex-direction: column; }
      #kpPanel { width: 100%; flex-direction: row; flex-wrap: wrap; }
      #imgContainer { width: 100%; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
    <h1 style="margin:0;">SpinEvo | Tisch-Labeling</h1>
    <div class="muted" style="font-size:12px;">
      <a href="./">← Ball-Labeler</a> ·
      <a href="label-review">Label Review</a>
    </div>
  </div>

  <!-- Task + Stats -->
  <div class="card">
    <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <div>
        <div class="muted" style="margin-bottom:4px;">Task auswählen</div>
        <select id="taskSelect"><option value="">(Tasks laden…)</option></select>
      </div>
      <div class="stats" id="taskStats" style="display:none;">
        <div class="stat">
          <div class="stat-dot dot-labeled"></div>
          <div><div class="stat-count" id="sLabeled">0</div><div class="stat-label">gelabelt</div></div>
        </div>
        <div class="stat">
          <div class="stat-dot dot-notable"></div>
          <div><div class="stat-count" id="sNoTable">0</div><div class="stat-label">kein Tisch</div></div>
        </div>
        <div class="stat">
          <div class="stat-dot dot-none"></div>
          <div><div class="stat-count" id="sNone">0</div><div class="stat-label">offen</div></div>
        </div>
        <div class="stat-total" id="sTotal"></div>
      </div>
    </div>
  </div>

  <!-- Filter + Nav -->
  <div class="card" id="reviewCard" style="display:none;">
    <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
      <div class="tabs">
        <button class="tab active" data-filter="all">Alle</button>
        <button class="tab" data-filter="none">Offen</button>
        <button class="tab" data-filter="labeled">Gelabelt</button>
        <button class="tab" data-filter="no_table">Kein Tisch</button>
      </div>
      <div class="nav-bar">
        <span class="nav-info" id="navInfo">– / –</span>
        <button class="btn" id="btnPrev" disabled>◀</button>
        <button class="btn" id="btnRandom">Zufall</button>
        <button class="btn" id="btnNext" disabled>▶</button>
        <input class="jump-input" id="jumpInput" type="number" min="1" placeholder="#" />
        <button class="btn" id="btnJump">→</button>
      </div>
    </div>

    <!-- Image + Panel -->
    <div class="main-layout">
      <!-- Image with canvas overlay -->
      <div>
        <div id="imgContainer">
          <img id="frameImg" src="" alt="frame" />
          <canvas id="kpCanvas"></canvas>
        </div>
      </div>

      <!-- Keypoint panel -->
      <div id="kpPanel">
        <div>
          <div class="kp-group-label">Tisch-Ecken</div>
          <div class="kp-list" id="kpListTable"></div>
        </div>
        <div>
          <div class="kp-group-label" style="margin-top:4px;">Netz</div>
          <div class="kp-list" id="kpListNet"></div>
        </div>

        <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
          <button class="btn btn-ok"      id="btnSave"    >✓ Speichern &amp; weiter <span class="kbd">↵</span></button>
          <button class="btn btn-notable" id="btnNoTable" >○ Kein Tisch <span class="kbd">N</span></button>
          <button class="btn btn-del"     id="btnDelete"  >🗑 Label löschen <span class="kbd">Del</span></button>
          <button class="btn btn-export"  id="btnExport"  >↓ YOLO-ZIP exportieren</button>
        </div>

        <div id="statusMsg"></div>

        <div class="muted" style="font-size:11px; line-height:1.6; margin-top:6px;">
          Klick = Punkt setzen (v=2) ·
          Rechtsklick auf Punkt = Visibility wechseln (2→1→löschen) ·
          <span class="kbd">1</span>–<span class="kbd">6</span> Punkt wählen ·
          <span class="kbd">0</span> = nicht im Bild ·
          <span class="kbd">←</span><span class="kbd">→</span> navigieren
        </div>
      </div>
    </div>

    <div id="statusMsg2" class="muted" style="margin-top:8px; font-size:12px;"></div>
  </div>
</div>
</body>
</html>
