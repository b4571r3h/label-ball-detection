<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpinEvo | Modell-Evaluation</title>
  <script defer src="static/eval.js?v=2"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #111827; --border: #1f2937; --muted: #94a3b8;
      --accent: #22d3ee; --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
      --orange: #f97316; --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system; background: var(--bg); color: #e5e7eb; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: #cbd5e1; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

    .btn { background: #1f2937; border: 1px solid #374151; padding: 7px 14px; border-radius: 9px; color: #e5e7eb; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: #374151; }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-primary { background: #1e3a5f; border-color: #2563eb; color: #bfdbfe; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-danger  { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
    .btn-danger:hover:not(:disabled) { background: #7f1d1d; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .model-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: #1f2937; border: 1px solid #374151; }
    .model-item input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
    .model-name { font-size: 13px; font-family: monospace; flex: 1; }
    .model-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .slider-wrap { display: flex; align-items: center; gap: 8px; }
    input[type=range] { accent-color: var(--accent); }

    progress { width: 100%; height: 8px; border-radius: 4px; appearance: none; }
    progress::-webkit-progress-bar  { background: #1f2937; border-radius: 4px; }
    progress::-webkit-progress-value { background: var(--accent); border-radius: 4px; }
    #progressWrap { display: none; }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { padding: 5px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: #e5e7eb; cursor: pointer; font-size: 13px; }
    .tab:hover { background: #1f2937; }
    .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }

    /* Statistik-Badges */
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .metric { background: #1f2937; border-radius: 8px; padding: 10px 12px; }
    .metric-val { font-size: 22px; font-weight: 700; line-height: 1; }
    .metric-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .col-tp { color: var(--green); }
    .col-tn { color: #64748b; }
    .col-fp { color: var(--red); }
    .col-fn { color: var(--orange); }
    .col-f1 { color: var(--accent); }

    /* Ergebnis-Liste */
    #resultsList { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .result-row {
      display: flex; align-items: center; gap: 10px;
      background: #1f2937; border-radius: 8px; padding: 7px 10px; cursor: pointer;
      border: 1px solid transparent; transition: border-color .15s;
    }
    .result-row:hover { border-color: #374151; }
    .result-row.selected { border-color: var(--accent); }
    .thumb { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: #000; flex-shrink: 0; }
    .result-info { flex: 1; min-width: 0; }
    .result-file { font-size: 12px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-meta { font-size: 11px; color: var(--muted); }
    .verdict-badges { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; }
    .vbadge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .vbadge-TP { background: rgba(34,197,94,.15); color: var(--green); }
    .vbadge-TN { background: rgba(100,116,139,.12); color: #64748b; }
    .vbadge-FP { background: rgba(239,68,68,.15); color: var(--red); }
    .vbadge-FN { background: rgba(249,115,22,.15); color: var(--orange); }

    /* Frame-Viewer */
    #viewerWrap { display: none; position: relative; }
    #viewerImgBox { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
    #viewerImg { max-width: 100%; border-radius: 10px; display: block; }
    #viewerCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px; pointer-events: none; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    #statusMsg { font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 6px; }
    .job-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:#1f2937; border:1px solid #374151; font-size:13px; flex-wrap:wrap; }
    .job-status-done    { color: var(--green);  font-weight:600; }
    .job-status-error   { color: var(--red);    font-weight:600; }
    .job-status-running { color: var(--yellow); font-weight:600; }
    .upload-zone { border: 2px dashed #374151; border-radius: 10px; padding: 18px; text-align: center; cursor: pointer; }
    .upload-zone:hover { border-color: var(--accent); }
    .kbd { display:inline-block; background:#0f172a; border:1px solid #374151; border-radius:4px; padding:0 5px; font-size:11px; font-family:monospace; color:var(--muted); }
    #paginationWrap { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
    <h1 style="margin:0;">SpinEvo | Modell-Evaluation</h1>
    <div class="muted" style="font-size:12px;">
      <a href="./">← Ball-Labeler</a> ·
      <a href="import-review">Import-Review</a>
    </div>
  </div>

  <!-- Frühere Jobs -->
  <div class="card" id="jobHistoryCard">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h2 style="margin:0;">Frühere Evaluationen</h2>
      <button class="btn btn-sm" id="btnRefreshJobs">↺ Aktualisieren</button>
    </div>
    <div id="jobList"><span class="muted">Lade…</span></div>
  </div>

  <!-- Modelle -->
  <div class="card">
    <h2>Modelle</h2>
    <div id="modelList" style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;"></div>
    <div class="upload-zone" id="uploadZone">
      <div class="muted">Modell hochladen (.pt) — Klick oder Drag &amp; Drop</div>
      <input type="file" id="fileInput" accept=".pt" style="display:none;" />
    </div>
    <div id="uploadStatus" class="muted" style="margin-top:6px; font-size:12px;"></div>
  </div>

  <!-- Konfiguration -->
  <div class="card">
    <h2>Konfiguration</h2>
    <div class="row" style="gap:20px;">
      <label style="display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer;">
        <input type="checkbox" id="chkLabeler" checked style="accent-color:var(--accent);" />
        Labeler-Datensatz
      </label>
      <label style="display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer;">
        <input type="checkbox" id="chkImport" checked style="accent-color:var(--accent);" />
        Import-Datensatz
      </label>
      <div class="slider-wrap">
        <span class="muted">Konfidenz-Schwelle:</span>
        <input type="range" id="confSlider" min="5" max="95" step="5" value="25" style="width:120px;" />
        <span id="confVal" style="font-size:13px; font-family:monospace; min-width:36px;">0.25</span>
      </div>
    </div>
    <div style="margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <button class="btn btn-primary" id="btnRun">▶ Evaluation starten</button>
      <span id="statusMsg"></span>
    </div>
    <div id="progressWrap" style="margin-top:10px;">
      <progress id="progressBar" value="0" max="100"></progress>
      <div id="progressLabel" class="muted" style="font-size:12px; margin-top:4px;"></div>
    </div>
  </div>

  <!-- Ergebnisse -->
  <div id="resultsSection" style="display:none;">
    <!-- Statistiken pro Modell -->
    <div id="statsSection"></div>

    <!-- Liste + Viewer -->
    <div class="card">
      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:10px; justify-content:space-between;">
        <div class="tabs" id="filterTabs">
          <button class="tab active" data-filter="all">Alle</button>
          <button class="tab" data-filter="FP">FP — False Positive</button>
          <button class="tab" data-filter="FN">FN — False Negative</button>
          <button class="tab" data-filter="TP">TP — True Positive</button>
          <button class="tab" data-filter="TN">TN — True Negative</button>
        </div>
        <select id="modelFilter" class="btn" style="cursor:pointer;"></select>
      </div>

      <div id="paginationWrap">
        <button class="btn btn-sm" id="btnPrevPage" disabled>◀</button>
        <span id="pageInfo">–</span>
        <button class="btn btn-sm" id="btnNextPage" disabled>▶</button>
        <span class="muted" id="totalInfo"></span>
      </div>

      <div id="resultsList"></div>
    </div>

    <!-- Frame-Viewer -->
    <div class="card" id="viewerWrap">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
        <div>
          <span id="viewerFilename" style="font-family:monospace; font-size:13px;"></span>
          <span id="viewerVerdicts" style="margin-left:8px;"></span>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm" id="btnViewerPrev" disabled>◀ vorher</button>
          <button class="btn btn-sm" id="btnViewerNext" disabled>▶ nächster</button>
        </div>
      </div>
      <div id="viewerImgBox">
        <img id="viewerImg" src="" alt="frame" />
        <canvas id="viewerCanvas"></canvas>
      </div>
      <div class="legend" id="viewerLegend"></div>
    </div>
  </div>
</div>
</body>
</html>
