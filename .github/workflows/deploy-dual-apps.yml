name: Deploy Dual Apps to IONOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push TT Ball Labeler
      uses: docker/build-push-action@v5
      with:
        context: ./ball-web-labeler-subpath
        file: ./ball-web-labeler-subpath/Dockerfile
        push: true
        build-args: |
          GIT_SHA=${{ github.sha }}
        tags: ghcr.io/${{ github.repository_owner }}/label-ball-detection:latest

    - name: Build and push Ball Analyzer
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./ball-web-analyzer/webapp/Dockerfile-fastapi
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/ball-web-analyzer:latest
    
    - name: Build and push Ball Admin
      uses: docker/build-push-action@v5
      with:
        context: ./ball-admin
        file: ./ball-admin/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/ball-admin:latest

    - name: Build and push Ball Auto-Label
      uses: docker/build-push-action@v5
      with:
        context: ./ball-auto-label
        file: ./ball-auto-label/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/ball-auto-label:latest

    - name: Deploy to IONOS Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.IONOS_HOST }}
        username: ${{ secrets.IONOS_USER }}
        key: ${{ secrets.IONOS_SSH_KEY }}
        script: |
          cd /root/tt-apps
          git pull origin main
          mkdir -p ball-auto-label/data
          # Nur bekannte Images ziehen (ball-analyzer:fixed und dev-spinevo bleiben außen vor)
          docker compose -f compose.ionos.yaml pull ball-labeler ball-admin ball-auto-label caddy
          # Nur diese Services neu starten (dev-spinevo hat eigenen Deploy-Workflow)
          docker compose -f compose.ionos.yaml up -d --force-recreate ball-labeler ball-admin ball-analyzer ball-auto-label caddy
          docker system prune -f
