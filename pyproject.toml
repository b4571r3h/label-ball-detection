[tool.ruff]
# Python lives in the service folders (ball-web-labeler-subpath, ball-auto-label,
# ball-web-analyzer, ball-admin, ball-yolo-import) and their tools.
target-version = "py310"
extend-exclude = ["**/data", "**/static", "eval-models", "ball-yolo-import", "**/*_backup.py"]

[tool.ruff.lint]
# The merge gate. Widen deliberately, not by drift.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Imports must follow the sys.path setup at the top of this entrypoint.
"ball-web-analyzer/webapp/fastapi_app.py" = ["E402"]
