version: '3.8'

services:
  # Ball Detection Labeler (bestehende App)
  ball-labeler:
    image: ghcr.io/b4571r3h/label-ball-detection:latest
    container_name: tt-ball-labeler
    environment:
      - LABEL_DATA_DIR=/data/labels
      - APP_ROOT_PATH=/ball-detection
      - LABEL_VIDEO_RETENTION_DAYS=5
      - LABEL_VIDEO_CLEANUP_INTERVAL_SEC=3600
      # YOLO-Daten (images/train|val, labels/train|val) — auf dem Host nach ./ball-yolo-import/ball_det/ legen (z. B. per rsync vom Mac)
      - IMPORT_YOLO_BALL_DIR=/data/yolo-import
    volumes:
      - ./ball-web-labeler-subpath/data:/data/labels
      - ./ball-yolo-import/ball_det:/data/yolo-import
    restart: unless-stopped

  # Ball Analyzer (neue App)
  ball-analyzer:
    image: ball-web-analyzer:fixed
    container_name: tt-ball-analyzer
    environment:
      - ANALYZER_DATA_DIR=/data/analyzer
      - APP_ROOT_PATH=/ball-analyzer
    volumes:
      - ./ball-web-analyzer/data:/data/analyzer
      - ./ball-web-analyzer/runs:/runs
      - ./ball-web-analyzer/infer_bounce_heatmap.py:/infer_bounce_heatmap.py
    restart: unless-stopped

  # Admin Panel
  ball-admin:
    image: ghcr.io/b4571r3h/ball-admin:latest
    container_name: tt-ball-admin
    environment:
      - LABEL_DATA_DIR=/data/labels
      - ANALYZER_DATA_DIR=/data/analyzer
      - APP_ROOT_PATH=/admin
    volumes:
      - ./ball-web-labeler-subpath/data:/data/labels
      - ./ball-web-analyzer/data:/data/analyzer
    restart: unless-stopped

  # SpinEvo Dev (dev.spinevo.app)
  dev-spinevo:
    image: ghcr.io/sreh/spinevo:latest
    container_name: tt-dev-spinevo
    environment:
      - SUPABASE_SERVICE_ROLE_KEY=${SPINEVO_SERVICE_ROLE_KEY}
      - MODAL_TOKEN=${SPINEVO_MODAL_TOKEN}
    restart: unless-stopped

  # Reverse Proxy (kombiniert beide Apps)
  caddy:
    image: caddy:2-alpine
    container_name: tt-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile-ssl:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - ball-labeler
      - ball-analyzer
      - ball-admin

volumes:
  caddy_data:
  caddy_config:
